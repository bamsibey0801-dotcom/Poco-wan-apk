name: Cetak APK Wan 2.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Buat Kode Aplikasi Android
        run: |
          mkdir -p app/src/main/java/com/example/pocowanvideo

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocoWanVideo"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.pocowanvideo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.pocowanvideo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="POCO Wan 2.1 Video"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/pocowanvideo/MainActivity.kt
          package com.example.pocowanvideo

          import android.annotation.SuppressLint
          import android.app.DownloadManager
          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.*
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null
              private lateinit var webView: WebView

              private val galleryLauncher = registerForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      fileUploadCallback?.onReceiveValue(arrayOf(uri))
                  } else {
                      fileUploadCallback?.onReceiveValue(null)
                  }
                  fileUploadCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(8, 8, 8, 8)
                  }

                  webView = WebView(this)

                  fun addServerBtn(title: String, url: String) {
                      val btn = Button(this).apply {
                          text = title
                          textSize = 11f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener { webView.loadUrl(url) }
                      }
                      topBar.addView(btn)
                  }

                  addServerBtn("Server 1 (Wan)", "https://huggingface.co/spaces/Wan-AI/Wan2.1")
                  addServerBtn("Server 2 (ZeroGPU)", "https://huggingface.co/spaces/multimodalart/Wan2.1")
                  addServerBtn("Cari Server", "https://huggingface.co/spaces?search=Wan+2.1+I2V")

                  webView.apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.mediaPlaybackRequiresUserGesture = false

                      CookieManager.getInstance().setAcceptCookie(true)
                      CookieManager.getInstance().setAcceptThirdPartyCookies(this, true)

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onShowFileChooser(
                              vw: WebView?,
                              filePathCallback: ValueCallback<Array<Uri>>?,
                              fileChooserParams: FileChooserParams?
                          ): Boolean {
                              fileUploadCallback?.onReceiveValue(null)
                              fileUploadCallback = filePathCallback
                              galleryLauncher.launch("image/*")
                              return true
                          }
                      }

                      setDownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                          try {
                              val request = DownloadManager.Request(Uri.parse(url))
                              request.setMimeType(mimeType)
                              request.addRequestHeader("User-Agent", userAgent)
                              val fileName = URLUtil.guessFileName(url, contentDisposition, mimeType)
                              request.setTitle(fileName)
                              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName)
                              val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                              dm.enqueue(request)
                              Toast.makeText(this@MainActivity, "Mengunduh video ke folder Download...", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "Gagal unduh: ${e.localizedMessage}", Toast.LENGTH_SHORT).show()
                          }
                      }

                      loadUrl("https://huggingface.co/spaces/Wan-AI/Wan2.1")
                  }

                  rootLayout.addView(topBar)
                  rootLayout.addView(webView)
                  setContentView(rootLayout)
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

      - name: Kompilasi APK
        run: gradle assembleDebug

      - name: Unggah File APK
        uses: actions/upload-artifact@v4
        with:
          name: POCO-Wan21-Video-APK
          path: app/build/outputs/apk/debug/app-debug.apk
